[pytest]
# 本仓库的回归主体是 tests/ 下几十份独立脚本（判据 `[PASS]/[FAIL]` + 退出码），
# 由 tests/ci_offline.py 统一执行；pytest 只收未来新增的 test_pytest_* 用例，
# 不把那些脚本当测试函数导入。
python_files = test_pytest_*.py

# 标记分离（审计 P2）：unit 纯离线无桌面/内核依赖；probe 需要真实 mpv / ffmpeg /
# 真屏幕。CI 只跑 unit（见 .github/workflows/ci.yml）。
markers =
    unit: 纯离线，不依赖 mpv/ffmpeg/真实图形桌面，CI 必跑
    probe: 需要真实 mpv、ffmpeg 或图形桌面抓帧，只在本地按需执行

addopts = -m "not probe" --strict-markers
